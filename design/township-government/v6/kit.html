<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.6 var(--font-sans);color:var(--color-text-primary);background:var(--color-background-secondary);-webkit-font-smoothing:antialiased}

main{display:flex;flex-direction:column;min-width:0;height:1000px;overflow:hidden}
.top{height:54px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--color-border-primary);background:var(--color-background-primary);flex:none}
.top h1{font-size:16px;margin:0;font-weight:600}.top .sp{flex:1}
.crumb{font-size:12.5px;color:var(--color-text-secondary)}

.file.sel{border-color:var(--brand-accent);box-shadow:0 0 0 3px var(--brand-accent-soft)}

.imgs{display:flex;gap:8px}.ph{width:150px;height:98px;border-radius:9px;overflow:hidden;border:1px solid var(--color-border-primary)}

.wave{display:flex;gap:2px;align-items:center;flex:1;height:20px}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.75}
.link{display:flex;gap:12px;width:420px;padding:11px 12px;border:1px solid var(--color-border-primary);border-left:3px solid var(--brand-secondary);border-radius:var(--border-radius-lg);background:var(--color-background-primary)}

.thumbs{display:flex;flex-direction:column;gap:8px}.thumbs i{width:54px;height:74px;background:#fff;border:1px solid var(--color-border-primary);border-radius:3px;display:block}.thumbs i.on{outline:2px solid var(--brand-accent)}

.input{border:1px solid var(--color-border-primary);border-radius:7px;padding:5px 10px;font-size:13px;background:var(--color-background-primary)}
