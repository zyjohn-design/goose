    function setting(item){

    function detail(){

    function render(){
      root.dataset.appearance=state.appearance;
      root.style.setProperty('--g-radius',design.radius+'px');root.style.setProperty('--g-gap',design.gap+'px');
      root.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-current',b.dataset.route===state.route?'page':'false'));

      root.querySelector('#g-account-name').textContent=state.profile.name;root.querySelector('#g-account-dept').textContent=state.profile.department;
      root.querySelector('#g-account-trigger .g-avatar').textContent=Array.from(state.profile.name)[0]||'张';

      const activeForm=content.querySelector('form');
      if(activeForm && state.forms[state.selected]) Object.entries(state.forms[state.selected]).forEach(([key,value])=>{const field=activeForm.elements.namedItem(key);if(field && 'value' in field)field.value=value;});

    function closeMenu(){root.querySelector('#g-account-menu').hidden=true;root.querySelector('#g-account-trigger').setAttribute('aria-expanded','false');}

    function open(id,tab){if(!byId[id])return;state.selected=id;state.tab=tab||tabSets[byId[id].group][0][0];state.tool=null;state.status='';closeMenu();render();save();content.querySelector('#g-detail-back')?.focus({preventScroll:true});}
    function toggle(list,id){state[list]=state[list].includes(id)?state[list].filter(x=>x!==id):[...state[list],id];}
    root.addEventListener('click',event=>{
      const target=event.target.closest('button');if(!target||!root.contains(target))return;
      if(target.dataset.localSubmit){const form=target.closest('form');if(form?.reportValidity())submitForm(form);return;}
      if(target.id==='g-account-trigger'){const menu=root.querySelector('#g-account-menu');menu.hidden=!menu.hidden;target.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button')?.focus({preventScroll:true});return;}
      if(target.dataset.route){navigate(target.dataset.route);return;}
      if(target.dataset.open){open(target.dataset.open,target.dataset.startTab);return;}
      if(target.dataset.favorite){toggle('favorites',target.dataset.favorite);target.setAttribute('aria-pressed',String(state.favorites.includes(target.dataset.favorite)));if(state.filter==='我的收藏')renderGrid();save();return;}
      if(target.dataset.filter){state.filter=target.dataset.filter;root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));renderGrid();save();return;}
      if(target.dataset.detailTab){state.tab=target.dataset.detailTab;render();save();return;}
      if(target.dataset.tool!==undefined){state.tool=state.tool===Number(target.dataset.tool)?null:Number(target.dataset.tool);render();save();return;}
      if(target.dataset.appRow!==undefined){const panel=content.querySelector(`[data-app-panel="${target.dataset.appRow}"]`);panel.hidden=!panel.hidden;target.setAttribute('aria-expanded',String(!panel.hidden));return;}
      if(target.dataset.appearance){state.appearance=target.dataset.appearance;render();save();return;}
      const action=target.dataset.action;
      if(action==='back'){const previous=state.selected;state.selected=null;render();save();content.querySelector(`[data-open="${previous}"]`)?.focus({preventScroll:true});}
      else if(action?.startsWith('go-')){state.tab=action.slice(3);render();save();}

      else if(action==='toggle-task'){toggle('paused',state.selected);render();note(state.paused.includes(state.selected)?'任务已在原型中暂停。':'任务已在原型中恢复；未创建真实调度。');save();}
      else if(action==='check-connection')note('连接待配置。此原型未发起网络请求；请在正式 Goose 中核对地址、服务状态与凭据。');

      else if(action==='compose'){const text=content.querySelector('#g-compose').value.trim();if(!text){note('请先填写一个示例工作需求。');return;}state.forms.notice={subject:text,context:'根据所填事项整理示例提纲。'};open(/档案/.test(text)?'archive-review':/政策/.test(text)?'search-skill':/会议/.test(text)?'minutes':'notice',/档案|政策/.test(text)?'overview':'use');}
    });
    root.addEventListener('input',event=>{

    function submitForm(form){
      const values=Object.fromEntries(new FormData(form));
      if(form.dataset.form==='recipe'){const item=byId[state.selected];const result=`${values.subject}\n\n${item.status} · 示例结构\n\n一、背景与目标\n${values.context}\n\n二、处理步骤\n${item.points.map((p,n)=>`${n+1}. ${p}`).join('\n')}\n\n三、待人工核对\n具体时间、责任人员、事实与依据须另行确认。\n\n本结果为本地模板预览，未调用模型或档案服务。`;state.forms[item.id]={...values,result};form.querySelector('[data-result]').innerHTML=`<div class="g-result">${escape(result)}</div>`;}
      else if(form.dataset.form==='profile'){state.profile={name:values.name.trim()||'张主任',department:values.department.trim(),organization:values.organization.trim()};root.querySelector('#g-account-name').textContent=state.profile.name;root.querySelector('#g-account-dept').textContent=state.profile.department;root.querySelector('#g-account-trigger .g-avatar').textContent=Array.from(state.profile.name)[0];form.querySelector('.g-avatar').textContent=Array.from(state.profile.name)[0];note('资料已用于当前原型展示，不代表实际登录或身份变更。');}
      else{state.forms[state.selected]=values;note(form.dataset.form==='extension'?'连接配置已保存在当前原型中。未写入正式 Goose 配置，也未连接服务。':form.dataset.form==='schedule'?'任务参数已保存在当前原型中。未创建定时任务。':'偏好已保存在本次原型中。');}
      save();
    }
    root.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();submitForm(form);});
    root.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')){const form=event.target.closest('form[data-form]');if(form){event.preventDefault();if(form.reportValidity())submitForm(form);}}});
    root.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(!root.querySelector('#g-account-menu').hidden){closeMenu();root.querySelector('#g-account-trigger').focus();}else if(state.selected){const previous=state.selected;state.selected=null;render();content.querySelector(`[data-open="${previous}"]`)?.focus({preventScroll:true});save();}});
    document.addEventListener('click',event=>{if(!event.target.closest('#township-card-lab .g-sidefoot'))closeMenu();});
    restore(window.openai?.widgetState);render();
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--g-radius',design.radius+'px');root.style.setProperty('--g-gap',design.gap+'px');}});tweak.addSlider(design,'radius',{label:'卡片圆角',min:6,max:14,step:1,unit:'px'});tweak.addSlider(design,'gap',{label:'卡片间距',min:12,max:24,step:2,unit:'px'});}
  })();
  </script>
</div>
