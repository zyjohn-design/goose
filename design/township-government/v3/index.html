utes&#x27;,&#x27;archive-recipe&#x27;].map(id=&gt;card(byId[id])).join(&#x27;&#x27;)}&lt;/div&gt;`;

    function catalog(){

    function renderGrid(){const grid=content.querySelector(&#x27;#g-catalog-grid&#x27;);if(!grid)return;const found=filtered();grid.innerHTML=found.length?found.map(card).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;g-empty&quot;&gt;没有匹配的卡片，请调整搜索或分类。&lt;/p&gt;&#x27;;content.querySelector(&#x27;#g-grid-meta&#x27;).textContent=`${found.length} 项 · 点击卡片查看内容与操作`;hydrateIcons();}

    function overview(item){return `&lt;h2&gt;${item.group===&#x27;recipes&#x27;?&#x27;办理流程&#x27;:item.group===&#x27;skills&#x27;?&#x27;能力与边界&#x27;:item.group===&#x27;extensions&#x27;?&#x27;服务能力&#x27;:&#x27;使用说明&#x27;}&lt;/h2&gt;&lt;ol class=&quot;g-list&quot;&gt;${item.points.map(t=&gt;`&lt;li&gt;${escape(t)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;${item.group===&#x27;recipes&#x27;?`&lt;div class=&quot;g-note&quot;&gt;输出形式：${escape(item.status)}。内容须核对后使用。&lt;/div&gt;${button(&#x27;填写参数并体验&#x27;,&#x27;go-use&#x27;,true)}`:item.group===&#x27;skills&#x27;?`${button(state.enabled.includes(item.id)?&#x27;停用技能（演示）&#x27;:&#x27;启用技能（演示）&#x27;,&#x27;toggle-skill&#x27;,true)}${item.id===&#x27;archive-review&#x27;?`&lt;div class=&quot;g-note&quot;&gt;实际依赖档案 MCP；服务未配置时不能形成真实证据意见。&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;g-textbutton cursor-interaction&quot; data-open=&quot;archive-mcp&quot;&gt;查看档案管理 MCP${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}`:item.group===&#x27;apps&#x27;?button(&#x27;打开应用预览&#x27;,&#x27;go-preview&#x27;,true):item.group===&#x27;extensions&#x27;?`&lt;div class=&quot;g-note&quot;&gt;${item.id===&#x27;archive-mcp&#x27;?&#x27;本机配置与 Skill 已安装，真实业务地址和凭据仍待配置。&#x27;:&#x27;该扩展为设计示例，具体能力以实际服务为准。&#x27;}&lt;/div&gt;${button(&#x27;查看连接配置&#x27;,&#x27;go-configure&#x27;,true)}`:item.group===&#x27;schedules&#x27;?`${button(state.paused.includes(item.id)?&#x27;恢复任务（演示）&#x27;:&#x27;暂停任务（演示）&#x27;,&#x27;toggle-task&#x27;,true)} &lt;button type=&quot;button&quot; class=&quot;g-button cursor-interaction&quot; data-action=&quot;go-configure&quot;&gt;调整时间&lt;/button&gt;&lt;div class=&quot;g-note&quot;&gt;不会创建真实任务或发送通知。&lt;/div&gt;`:&#x27;&#x27;}`;}
