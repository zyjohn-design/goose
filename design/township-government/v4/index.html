<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>政务智办 · 大对话区主题样例</title>
  <style>
    :root{color-scheme:light;--red:#a52830;--ink:#252b32;--muted:#636974;--line:#e4e1da;--bg:#f7f5f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 "PingFang SC","Microsoft YaHei",sans-serif}header{padding:24px 32px 20px;background:#fff;border-top:4px solid var(--red);border-bottom:1px solid var(--line)}header small{color:var(--red);letter-spacing:3px}h1{font-size:25px;margin:6px 0;font-weight:600}p{margin:0;color:var(--muted)}main{max-width:1700px;margin:0 auto;padding:24px 32px}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:3px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}.choices{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.choices button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.choices button[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:#f7edee}.choices.modes{border-left:1px solid var(--line);padding-left:14px;margin-left:4px}.links{display:flex;gap:12px;font-size:13px}.links a{color:var(--red);text-underline-offset:4px}figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}figure img{display:block;width:100%;height:auto}figcaption{padding:12px 16px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);color:var(--muted)}figcaption strong{color:var(--ink);font-weight:500}.notes{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}.notes span:before{content:"·";margin-right:8px;color:var(--red)}footer{padding-top:20px;font-size:12px;color:var(--muted)}footer a{color:var(--red);text-underline-offset:4px;margin-right:16px}@media(max-width:650px){header{padding:20px}main{padding:18px 16px}.choices.modes{border:0;padding:0;margin:0}.toolbar>.choices{gap:8px}h1{font-size:22px}.links{width:100%}}
  </style>
</head>
<body>
  <header><small>政务智办 · 第四版</small><h1>更大的对话区，更紧凑的工作台</h1><p>保留原图结构，重新平衡输入、快捷入口与辅助列表的空间。</p></header>
  <main>
    <div class="toolbar">
      <div class="choices" aria-label="选择主题">
        <button type="button" data-theme="civic" aria-pressed="true">朱砂政务</button>
        <button type="button" data-theme="navy" aria-pressed="false">深蓝政务</button>
        <button type="button" data-theme="forest" aria-pressed="false">青山雅政</button>
        <div class="choices modes" aria-label="选择明暗外观"><button type="button" data-mode="light" aria-pressed="true">Light</button><button type="button" data-mode="dark" aria-pressed="false">Dark</button></div>
      </div>
      <div class="links"><a id="original" href="images/01-civic-light-large-chat.png" target="_blank" rel="noopener">查看原图 ↗</a><a id="download" href="images/01-civic-light-large-chat.png" download>下载 PNG</a></div>
    </div>
    <figure><img id="sample" src="images/01-civic-light-large-chat.png" alt="朱砂政务 Light 首页：扩大对话编辑区，紧凑排列快捷卡片与底部列表。"><figcaption><strong id="sample-title" aria-live="polite">朱砂政务 · Light</strong><span>AI 生成视觉样例 · 实际界面待按方案实现</span></figcaption></figure>
    <div class="notes"><span>对话输入区为视觉主体</span><span>快捷卡片保留图标、减少内边距</span><span>最近会话与常用能力保持两栏</span></div>
    <footer><a href="README.md">本轮调整说明</a><a href="layout.json">布局目标</a><a href="prompts.json">完整提示词</a><a href="../v3/index.html">上一版卡片交互原型</a></footer>
  </main>
  <script>
    const themes={civic:{name:'朱砂政务',index:0},navy:{name:'深蓝政务',index:1},forest:{name:'青山雅政',index:2}};
    let theme='civic',mode='light';
    function render(){
      const number=themes[theme].index*2+(mode==='light'?1:2);
      const file=String(number).padStart(2,'0')+'-'+theme+'-'+mode+'-large-chat.png';
      const title=themes[theme].name+' · '+(mode==='light'?'Light':'Dark');
      document.querySelectorAll('[data-theme]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===theme)));
      document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
      document.getElementById('sample').src='images/'+file;
      document.getElementById('sample').alt=title+' 首页：扩大对话编辑区，紧凑排列快捷卡片与底部列表。';
      document.getElementById('sample-title').textContent=title;
      document.getElementById('original').href='images/'+file;
      document.getElementById('download').href='images/'+file;
      document.getElementById('download').download=file;
    }
    document.querySelectorAll('[data-theme]').forEach(button=>button.addEventListener('click',()=>{theme=button.dataset.theme;render();}));
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;render();}));
  </script>
</body>
</html>
